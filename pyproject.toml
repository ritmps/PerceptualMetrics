[project]
name = "perceptual-metrics"
version = "0.1.0"
description = "Perceptual metrics exploration with PyTorch and Wolfram Language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.0",
    "lpips>=0.1.4",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pyzmq>=26.0.0",
    "requests>=2.32.0",
    "scipy>=1.15.0",
    "statsmodels>=0.14.6",
    "torch>=2.0.0",
    "torchvision>=0.20.0",
    "tqdm>=4.66.0",
    "scikit-image>=0.20.0",
    "wolframalpha>=5.1.0",
    "wolframclient>=1.4.0",
]

[tool.uv.sources]
lpips = { path = "PerceptualSimilarity", editable = true }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
